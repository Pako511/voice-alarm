<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Orbit</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background: #0a0a0a;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .screen {
            text-align: center;
            pointer-events: auto;
        }

        .hidden {
            display: none !important;
        }

        #title {
            font-size: 48px;
            font-weight: bold;
            color: #00ffff;
            text-shadow: 0 0 20px #00ffff;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }

        #subtitle {
            font-size: 16px;
            color: #ffffff;
            opacity: 0.8;
            margin-bottom: 30px;
        }

        #highScoreDisplay {
            font-size: 24px;
            color: #ff00ff;
            margin-bottom: 30px;
            text-shadow: 0 0 10px #ff00ff;
        }

        .btn {
            background: linear-gradient(135deg, #ffffff, #e0e0e0);
            border: none;
            padding: 20px 60px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.1s;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid #ffffff;
            color: #ffffff;
            padding: 15px 40px;
            font-size: 18px;
        }

        #scoreDisplay {
            position: absolute;
            top: 60px;
            font-size: 72px;
            font-weight: bold;
            color: #ffffff;
            opacity: 0.3;
        }

        #gameOverTitle {
            font-size: 42px;
            font-weight: bold;
            color: #ff3333;
            text-shadow: 0 0 20px #ff3333;
            margin-bottom: 20px;
        }

        #finalScore {
            font-size: 32px;
            color: #ffffff;
            margin-bottom: 10px;
        }

        #newRecord {
            font-size: 20px;
            color: #ff00ff;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #ff00ff;
        }

        #hint {
            font-size: 14px;
            color: #ffffff;
            opacity: 0.6;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui">
        <!-- Menu Screen -->
        <div id="menuScreen" class="screen">
            <div id="title">NEON ORBIT</div>
            <div id="subtitle">Tap to rotate • Avoid the red zones</div>
            <div id="highScoreDisplay"></div>
            <button class="btn" id="playBtn">PLAY</button>
            <div id="hint">Tap anywhere to rotate 180°</div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="screen hidden">
            <div id="gameOverTitle">GAME OVER</div>
            <div id="finalScore">Score: 0</div>
            <div id="newRecord" class="hidden">🏆 NEW RECORD! 🏆</div>
            <button class="btn" id="playAgainBtn">PLAY AGAIN</button>
            <button class="btn btn-secondary" id="menuBtn">MENU</button>
        </div>

        <!-- Score Display (during gameplay) -->
        <div id="scoreDisplay" class="hidden">0</div>
    </div>

    <script>
        // Canvas setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Game constants
        let CENTER_X, CENTER_Y, ORBIT_RADIUS, OBSTACLE_SIZE, PLAYER_SIZE;
        
        function updateConstants() {
            CENTER_X = canvas.width / 2;
            CENTER_Y = canvas.height / 2 - 100;
            ORBIT_RADIUS = Math.min(canvas.width, canvas.height) * 0.15;
            OBSTACLE_SIZE = 50;
            PLAYER_SIZE = 20;
        }
        updateConstants();

        // Color themes
        const COLOR_THEMES = [
            { background: '#0a0a0a', primary: '#00ffff', secondary: '#ff00ff', obstacle: '#ff3333', text: '#ffffff' },
            { background: '#0f0f23', primary: '#00ff88', secondary: '#ffaa00', obstacle: '#ff4444', text: '#e0e0e0' },
            { background: '#1a0a2e', primary: '#bd00ff', secondary: '#00d4ff', obstacle: '#ff6b6b', text: '#f0f0f0' },
            { background: '#001a1a', primary: '#00ffcc', secondary: '#ff99ff', obstacle: '#ff5555', text: '#ffffff' },
        ];

        // Game state
        let gameState = 'menu'; // menu, playing, gameover
        let score = 0;
        let highScore = localStorage.getItem('neonOrbitHighScore') || 0;
        let angle = -Math.PI / 2;
        let obstacles = [];
        let themeIndex = 0;
        let speed = 0.08;
        let lastTime = 0;

        // UI Elements
        const menuScreen = document.getElementById('menuScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const highScoreDisplay = document.getElementById('highScoreDisplay');
        const finalScoreDisplay = document.getElementById('finalScore');
        const newRecordDisplay = document.getElementById('newRecord');

        // Initialize high score display
        if (highScore > 0) {
            highScoreDisplay.textContent = `Best: ${highScore}`;
        }

        // Generate obstacle
        function generateObstacle() {
            const gapSize = Math.max(0.8, 1.5 - score * 0.05);
            const gapCenter = Math.random() * Math.PI * 2;
            
            return {
                y: -OBSTACLE_SIZE,
                gapStart: gapCenter - gapSize / 2,
                gapEnd: gapCenter + gapSize / 2,
                passed: false,
            };
        }

        // Start game
        function startGame() {
            gameState = 'playing';
            score = 0;
            angle = -Math.PI / 2;
            obstacles = [generateObstacle()];
            speed = 0.08;
            themeIndex = Math.floor(Math.random() * COLOR_THEMES.length);
            lastTime = Date.now();
            
            menuScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            scoreDisplay.classList.remove('hidden');
            scoreDisplay.textContent = '0';
            
            requestAnimationFrame(gameLoop);
        }

        // Handle tap/click
        function handleInput(e) {
            e.preventDefault();
            if (gameState === 'playing') {
                angle += Math.PI;
            }
        }

        canvas.addEventListener('touchstart', handleInput);
        canvas.addEventListener('mousedown', handleInput);

        // Game loop
        function gameLoop() {
            if (gameState !== 'playing') return;

            const now = Date.now();
            const deltaTime = now - lastTime;
            
            if (deltaTime >= 16) {
                lastTime = now;

                // Update obstacles
                obstacles.forEach(obs => {
                    obs.y += speed * 8;
                });

                // Remove off-screen obstacles
                obstacles = obstacles.filter(obs => obs.y < canvas.height + OBSTACLE_SIZE);

                // Add new obstacle
                if (obstacles.length > 0 && obstacles[obstacles.length - 1].y > 150) {
                    obstacles.push(generateObstacle());
                }

                // Collision detection
                const playerX = CENTER_X + Math.cos(angle) * ORBIT_RADIUS;
                const playerY = CENTER_Y + Math.sin(angle) * ORBIT_RADIUS;

                obstacles.forEach(obs => {
                    if (obs.y < playerY + PLAYER_SIZE && obs.y + OBSTACLE_SIZE > playerY - PLAYER_SIZE && !obs.passed) {
                        let normalizedAngle = angle;
                        while (normalizedAngle < 0) normalizedAngle += Math.PI * 2;
                        while (normalizedAngle >= Math.PI * 2) normalizedAngle -= Math.PI * 2;
                        
                        let gapStart = obs.gapStart;
                        let gapEnd = obs.gapEnd;
                        while (gapStart < 0) gapStart += Math.PI * 2;
                        while (gapEnd < 0) gapEnd += Math.PI * 2;
                        while (gapStart >= Math.PI * 2) gapStart -= Math.PI * 2;
                        while (gapEnd >= Math.PI * 2) gapEnd -= Math.PI * 2;

                        const inSafeZone = (normalizedAngle >= gapStart && normalizedAngle <= gapEnd) ||
                                          (normalizedAngle + Math.PI * 2 >= gapStart && normalizedAngle + Math.PI * 2 <= gapEnd);

                        if (!inSafeZone) {
                            gameOver();
                        } else if (!obs.passed) {
                            obs.passed = true;
                            score++;
                            scoreDisplay.textContent = score;
                            
                            if (score % 5 === 0) {
                                speed = Math.min(speed + 0.01, 0.3);
                            }
                        }
                    }
                });
            }

            render();
            requestAnimationFrame(gameLoop);
        }

        // Render
        function render() {
            const theme = COLOR_THEMES[themeIndex % COLOR_THEMES.length];
            
            // Clear canvas
            ctx.fillStyle = theme.background;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'playing' || gameState === 'gameover') {
                // Draw orbit circle
                ctx.beginPath();
                ctx.arc(CENTER_X, CENTER_Y, ORBIT_RADIUS, 0, Math.PI * 2);
                ctx.strokeStyle = theme.primary + '40';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Draw center point
                ctx.beginPath();
                ctx.arc(CENTER_X, CENTER_Y, 6, 0, Math.PI * 2);
                ctx.fillStyle = theme.primary;
                ctx.fill();

                // Draw player with glow
                const playerX = CENTER_X + Math.cos(angle) * ORBIT_RADIUS;
                const playerY = CENTER_Y + Math.sin(angle) * ORBIT_RADIUS;
                
                ctx.shadowColor = theme.secondary;
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(playerX, playerY, PLAYER_SIZE / 2, 0, Math.PI * 2);
                ctx.fillStyle = theme.secondary;
                ctx.fill();
                ctx.shadowBlur = 0;

                // Draw obstacles
                obstacles.forEach(obs => {
                    ctx.shadowColor = theme.obstacle;
                    ctx.shadowBlur = 15;
                    
                    // Left segment
                    ctx.fillStyle = theme.obstacle;
                    ctx.beginPath();
                    ctx.roundRect(CENTER_X - OBSTACLE_SIZE, obs.y, OBSTACLE_SIZE, OBSTACLE_SIZE, 8);
                    ctx.fill();
                    
                    // Right segment
                    ctx.beginPath();
                    ctx.roundRect(CENTER_X, obs.y, OBSTACLE_SIZE, OBSTACLE_SIZE, 8);
                    ctx.fill();
                    
                    ctx.shadowBlur = 0;
                });
            }
        }

        // Game over
        function gameOver() {
            gameState = 'gameover';
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('neonOrbitHighScore', highScore);
                newRecordDisplay.classList.remove('hidden');
            } else {
                newRecordDisplay.classList.add('hidden');
            }
            
            finalScoreDisplay.textContent = `Score: ${score}`;
            highScoreDisplay.textContent = `Best: ${highScore}`;
            
            scoreDisplay.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
        }

        // Button listeners
        document.getElementById('playBtn').addEventListener('click', startGame);
        document.getElementById('playAgainBtn').addEventListener('click', startGame);
        document.getElementById('menuBtn').addEventListener('click', () => {
            gameOverScreen.classList.add('hidden');
            menuScreen.classList.remove('hidden');
            gameState = 'menu';
            render();
        });

        // Initial render
        render();
    </script>
</body>
</html>
